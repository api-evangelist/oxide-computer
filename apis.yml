apis:
- aid: oxide-computer-region-api
  name: Oxide Region API
  description: 'The Oxide Region API is the public REST contract of the Oxide control
    plane (Nexus). It is an OpenAPI 3.0.3 document with 217 paths, 315 operations and
    469 schemas, organized by the resources an operator or tenant works with: silos,
    projects, instances, disks, snapshots, images, VPCs and subnets, firewall rules,
    floating/ephemeral IPs, IP and subnet pools, affinity and anti-affinity groups,
    alert receivers and webhook secrets, audit log, metrics and OxQL, hardware and
    rack inventory, networking (BGP, BFD, switch port settings), SAML identity providers
    and SCIM tokens, support bundles, and system update. Auth is an OAuth 2.0 device
    authorization grant producing a bearer device token, plus browser session cookies
    for the web console.'
  humanURL: https://docs.oxide.computer/api
  baseURL: https://{oxide-control-plane-host}
