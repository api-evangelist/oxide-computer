aid: oxide-computer
name: Oxide
description: 'Oxide Computer Company builds a rack-scale cloud computer: integrated
  server sleds (Gimlet), a rack-level switch (Sidecar), Oxide''s own illumos distribution
  (Helios), the Propolis/bhyve hypervisor and the Crucible distributed block store,
  all driven by a single control plane called Nexus. Nexus exposes the Oxide Region
  API, a 315-operation OpenAPI 3.0.3 REST contract covering silos, projects, instances,
  disks, snapshots, images, VPCs, subnets, firewall rules, floating and ephemeral IPs,
  IP pools, affinity groups, alerts and webhook receivers, audit log, metrics/OxQL,
  hardware inventory, BGP/BFD networking, SAML and SCIM identity, support bundles and
  system update. Because the product is a rack a customer owns, the API is served from
  the customer''s own control-plane domain rather than a vendor-hosted endpoint. Oxide
  publishes first-party Rust, TypeScript and Go SDKs, an `oxide` CLI, a Terraform provider
  and a Packer plugin, and develops essentially the entire stack in the open on GitHub.'
