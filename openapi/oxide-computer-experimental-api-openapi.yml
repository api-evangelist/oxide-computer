    MulticastGroup:
      description: View of a Multicast Group
      type: object
      properties:
        description:
          description: Human-readable free-form text about a resource
          type: string
        has_any_source_member:
          description: 'True if any member joined without specifying source IPs (any-source).


            When true, at least one member receives traffic from any source rather than filtering to specific sources.'
          type: boolean
        id:
          description: Unique, immutable, system-controlled identifier for each resource
          type: string
          format: uuid
        ip_pool_id:
          description: The ID of the IP pool this resource belongs to.
          type: string
          format: uuid
        multicast_ip:
          description: The multicast IP address held by this resource.
          type: string
          format: ip
        name:
          description: Unique, mutable, user-controlled identifier for each resource
          allOf:
          - $ref: '#/components/schemas/Name'
        source_ips:
          description: 'Deduplicated union of source IPs specified by members.


            Contains only sources from members that joined with explicit `source_ips`. Members using any-source multicast (empty `source_ips`) do not contribute, so a non-empty value does not imply all members use source filtering. For SSM addresses (232/8, ff3x::/32), this is always non-empty.'
          type: array
          items:
            type: string
            format: ip
        state:
          description: Current state of the multicast group.
          type: string
        time_created:
          description: Timestamp when this resource was created
          type: string
          format: date-time
        time_modified:
          description: Timestamp when this resource was last modified
          type: string
          format: date-time
