openapi: 3.2.0
info:
  title: Oxide Region Metrics API
  description: API for interacting with the Oxide control plane
  contact:
    url: https://oxide.computer
    email: api@oxide.computer
  version: 2026081901.0.0
tags:
- name: metrics
  description: Silo-scoped metrics
  externalDocs:
    url: http://docs.oxide.computer/api/metrics
paths:
  /v1/metrics/{metric_name}:
    get:
      tags:
      - metrics
      summary: View metrics
      description: View CPU, memory, or storage utilization metrics at the silo or project level.
      operationId: silo_metric
      parameters:
      - in: path
        name: metric_name
        required: true
        schema:
          $ref: '#/components/schemas/SystemMetricName'
      - in: query
        name: end_time
        description: An exclusive end time of metrics.
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: order
        description: Query result order
        schema:
          $ref: '#/components/schemas/PaginationOrder'
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: start_time
        description: An inclusive start time of metrics.
        schema:
          type: string
          format: date-time
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - end_time
        - start_time
components:
