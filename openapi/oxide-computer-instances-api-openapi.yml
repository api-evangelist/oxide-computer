    InstanceCreate:
      description: Create-time parameters for an `Instance`
      type: object
      properties:
        anti_affinity_groups:
          description: Anti-affinity groups to which this instance should be added.
          default: []
          type: array
          items:
            $ref: '#/components/schemas/NameOrId'
        auto_restart_policy:
          description: 'The auto-restart policy for this instance.


            This policy determines whether the instance should be automatically restarted by the control plane on failure. If this is `null`, no auto-restart policy will be explicitly configured for this instance, and the control plane will select the default policy when determining whether the instance can be automatically restarted.


            Currently, the global default auto-restart policy is "best-effort", so instances with `null` auto-restart policies will be automatically restarted. However, in the future, the default policy may be configurable through other mechanisms, such as on a per-project basis. In that case, any configured default policy will be used if this is `null`.'
          default: null
          allOf:
          - $ref: '#/components/schemas/InstanceAutoRestartPolicy'
        boot_disk:
          description: 'The disk the instance is configured to boot from.


            This disk can either be attached if it already exists or created along with the instance.


            Specifying a boot disk is optional but recommended to ensure predictable boot behavior. The boot disk can be set during instance creation or later if the instance is stopped. The boot disk counts against the disk attachment limit.


            An instance that does not have a boot disk set will use the boot options specified in its UEFI settings, which are controlled by both the instance''s UEFI firmware and the guest operating system. Boot options can change as disks are attached and detached, which may result in an instance that only boots to the EFI shell until a boot disk is set.'
          default: null
          allOf:
          - $ref: '#/components/schemas/InstanceDiskAttachment'
        cpu_platform:
          description: The CPU platform to be used for this instance. If this is `null`, the instance requires no particular CPU platform; when it is started the instance will have the most general CPU platform supported by the sled it is initially placed on.
          default: null
          allOf:
          - $ref: '#/components/schemas/InstanceCpuPlatform'
        description:
          type: string
        disks:
          description: 'A list of disks to be attached to the instance.


            Disk attachments of type "create" will be created, while those of type "attach" must already exist.


            The order of this list does not guarantee a boot order for the instance. Use the boot_disk attribute to specify a boot disk. When boot_disk is specified it will count against the disk attachment limit.'
          default: []
          type: array
          items:
            $ref: '#/components/schemas/InstanceDiskAttachment'
        enable_jumbo_frames:
          description: Enable jumbo frames (8500 byte MTU) on the instance's primary OPTE interface. Requires the fleet-wide jumbo-frames opt-in to be enabled by an operator; otherwise this field must be `false`. Changes only take effect on the next instance restart.
          default: false
          type: boolean
        external_ips:
          description: 'The external IP addresses provided to this instance.


            By default, all instances have outbound connectivity, but no inbound connectivity. These external addresses can be used to provide a fixed, known IP address for making inbound connections to the instance.'
          default: []
          type: array
          items:
            $ref: '#/components/schemas/ExternalIpCreate'
        hostname:
          description: The hostname to be assigned to the instance
          allOf:
          - $ref: '#/components/schemas/Hostname'
        memory:
          description: The amount of RAM (in bytes) to be allocated to the instance
          allOf:
          - $ref: '#/components/schemas/ByteCount'
        multicast_groups:
          description: 'Multicast groups this instance should join at creation.


            Groups can be specified by name, UUID, or IP address. Non-existent groups are created automatically.'
          default: []
          type: array
          items:
            $ref: '#/components/schemas/MulticastGroupJoinSpec'
        name:
          $ref: '#/components/schemas/Name'
        ncpus:
          description: The number of vCPUs to be allocated to the instance
          allOf:
          - $ref: '#/components/schemas/InstanceCpuCount'
        network_interfaces:
          description: The network interfaces to be created for this instance.
          default:
            type: default_dual_stack
          allOf:
          - $ref: '#/components/schemas/InstanceNetworkInterfaceAttachment'
        ssh_public_keys:
          description: 'An allowlist of SSH public keys to be transferred to the instance via cloud-init during instance creation.


            If not provided, all SSH public keys from the user''s profile will be sent. If an empty list is provided, no public keys will be transmitted to the instance.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NameOrId'
        start:
          description: Should this instance be started upon creation; true by default.
          default: true
          type: boolean
        user_data:
          description: User data for instance initialization systems (such as cloud-init). Must be a Base64-encoded string, as specified in RFC 4648 § 4 (+ and / characters with padding). Maximum 32 KiB unencoded data.
          default: ''
          type: string
          format: byte
      required:
      - description
      - hostname
      - memory
      - name
      - ncpus
    PrivateIpv4Stack:
      description: The VPC-private IPv4 stack for a network interface
      type: object
      properties:
        ip:
          description: The VPC-private IPv4 address for the interface.
          type: string
          format: ipv4
        transit_ips:
          description: A set of additional IPv4 networks that this interface may send and receive traffic on.
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Net'
      required:
      - ip
      - transit_ips
    InstanceUpdate:
      description: Parameters of an `Instance` that can be reconfigured after creation.
      type: object
      properties:
        auto_restart_policy:
          description: 'The auto-restart policy for this instance.


            This policy determines whether the instance should be automatically restarted by the control plane on failure. If this is `null`, any explicitly configured auto-restart policy will be unset, and the control plane will select the default policy when determining whether the instance can be automatically restarted.


            Currently, the global default auto-restart policy is "best-effort", so instances with `null` auto-restart policies will be automatically restarted. However, in the future, the default policy may be configurable through other mechanisms, such as on a per-project basis. In that case, any configured default policy will be used if this is `null`.'
          allOf:
          - $ref: '#/components/schemas/InstanceAutoRestartPolicy'
        boot_disk:
          description: 'The disk the instance is configured to boot from.


            Setting a boot disk is optional but recommended to ensure predictable boot behavior. The boot disk can be set during instance creation or later if the instance is stopped. The boot disk counts against the disk attachment limit.


            An instance that does not have a boot disk set will use the boot options specified in its UEFI settings, which are controlled by both the instance''s UEFI firmware and the guest operating system. Boot options can change as disks are attached and detached, which may result in an instance that only boots to the EFI shell until a boot disk is set.'
          allOf:
          - $ref: '#/components/schemas/NameOrId'
        cpu_platform:
          description: The CPU platform to be used for this instance. If this is `null`, the instance requires no particular CPU platform; when it is started the instance will have the most general CPU platform supported by the sled it is initially placed on.
          allOf:
          - $ref: '#/components/schemas/InstanceCpuPlatform'
        enable_jumbo_frames:
          description: Update the per-instance jumbo-frames opt-in. Setting this to `true` requires the fleet-wide jumbo-frames opt-in to be enabled. Changes only take effect on the next instance restart.
          type: boolean
        memory:
          description: The amount of RAM (in bytes) to be allocated to the instance
          allOf:
          - $ref: '#/components/schemas/ByteCount'
        multicast_groups:
          description: 'Multicast groups this instance should join.


            When specified, this replaces the instance''s current multicast group membership with the new set of groups. The instance will leave any groups not listed here and join any new groups that are specified.


            Each entry can specify the group by name, UUID, or IP address, along with optional source IP filtering for SSM (Source-Specific Multicast). When a group doesn''t exist, it will be implicitly created using the default multicast pool (or you can specify `ip_version` to disambiguate if needed).


            If not provided, the instance''s multicast group membership will not be changed.'
          default: null
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MulticastGroupJoinSpec'
        ncpus:
          description: The number of vCPUs to be allocated to the instance
          allOf:
          - $ref: '#/components/schemas/InstanceCpuCount'
      required:
      - auto_restart_policy
      - boot_disk
      - cpu_platform
      - enable_jumbo_frames
      - memory
      - ncpus
