openapi: 3.2.0
info:
  title: Oxide Region Instances API
  description: API for interacting with the Oxide control plane
  contact:
    url: https://oxide.computer
    email: api@oxide.computer
  version: 2026081901.0.0
tags:
- name: instances
  description: Virtual machine instances are the basic unit of computation. These operations are used for provisioning, controlling, and destroying instances.
  externalDocs:
    url: http://docs.oxide.computer/api/instances
paths:
  /v1/instances:
    get:
      tags:
      - instances
      summary: List instances
      operationId: instance_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - project
    post:
      tags:
      - instances
      summary: Create instance
      operationId: instance_create
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCreate'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}:
    get:
      tags:
      - instances
      summary: Fetch instance
      operationId: instance_view
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - instances
      summary: Update instance
      operationId: instance_update
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceUpdate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - instances
      summary: Delete instance
      operationId: instance_delete
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/anti-affinity-groups:
    get:
      tags:
      - instances
      summary: List anti-affinity groups containing instance
      operationId: instance_anti_affinity_group_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntiAffinityGroupResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/instances/{instance}/disks:
    get:
      tags:
      - instances
      summary: List disks for instance
      operationId: instance_disk_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/instances/{instance}/disks/attach:
    post:
      tags:
      - instances
      summary: Attach disk to instance
      operationId: instance_disk_attach
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskPath'
        required: true
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/disks/detach:
    post:
      tags:
      - instances
      summary: Detach disk from instance
      operationId: instance_disk_detach
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskPath'
        required: true
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/external-ips:
    get:
      tags:
      - instances
      summary: List external IP addresses
      operationId: instance_external_ip_list
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIpResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/external-ips/ephemeral:
    post:
      tags:
      - instances
      summary: Allocate and attach ephemeral IP to instance
      operationId: instance_ephemeral_ip_attach
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EphemeralIpCreate'
        required: true
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIp'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - instances
      summary: Detach and deallocate ephemeral IP from instance
      description: When an instance has both IPv4 and IPv6 ephemeral IPs, the `ip_version` query parameter must be specified to identify which IP to detach.
      operationId: instance_ephemeral_ip_detach
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: ip_version
        description: 'The IP version of the ephemeral IP to detach.


          Required when the instance has both IPv4 and IPv6 ephemeral IPs. If only one ephemeral IP is attached, this field may be omitted.'
        schema:
          $ref: '#/components/schemas/IpVersion'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/external-subnets:
    get:
      tags:
      - instances
      summary: List external subnets attached to instance
      operationId: instance_external_subnet_list
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSubnetResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/reboot:
    post:
      tags:
      - instances
      summary: Reboot instance
      operationId: instance_reboot
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/serial-console:
    get:
      tags:
      - instances
      summary: Fetch instance serial console
      operationId: instance_serial_console
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: from_start
        description: Character index in the serial buffer from which to read, counting the bytes output since instance start. If this is not provided, `most_recent` must be provided, and if this *is* provided, `most_recent` must *not* be provided.
        schema:
          type:
          - integer
          - 'null'
          format: uint64
          minimum: 0
      - in: query
        name: max_bytes
        description: Maximum number of bytes of buffered serial console contents to return. If the requested range runs to the end of the available buffer, the data returned will be shorter than `max_bytes`.
        schema:
          type:
          - integer
          - 'null'
          format: uint64
          minimum: 0
      - in: query
        name: most_recent
        description: Character index in the serial buffer from which to read, counting *backward* from the most recently buffered data retrieved from the instance. (See note on `from_start` about mutual exclusivity)
        schema:
          type:
          - integer
          - 'null'
          format: uint64
          minimum: 0
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSerialConsoleData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/serial-console/stream:
    get:
      tags:
      - instances
      summary: Stream instance serial console
      operationId: instance_serial_console_stream
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: most_recent
        description: Character index in the serial buffer from which to read, counting *backward* from the most recently buffered data retrieved from the instance.
        schema:
          type:
          - integer
          - 'null'
          format: uint64
          minimum: 0
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '101':
          description: Negotiating protocol upgrade from HTTP/1.1 to WebSocket
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-websocket: {}
  /v1/instances/{instance}/ssh-public-keys:
    get:
      tags:
      - instances
      summary: List SSH public keys for instance
      description: List SSH public keys injected via cloud-init during instance creation. Note that this list is a snapshot in time and will not reflect updates made after the instance is created.
      operationId: instance_ssh_public_key_list
      parameters:
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKeyResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/instances/{instance}/start:
    post:
      tags:
      - instances
      summary: Boot instance
      operationId: instance_start
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/instances/{instance}/stop:
    post:
      tags:
      - instances
      summary: Stop instance
      operationId: instance_stop
      parameters:
      - in: query
        name: project
        description: Name or ID of the project
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: path
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '202':
          description: successfully enqueued operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/network-interfaces:
    get:
      tags:
      - instances
      summary: List network interfaces
      operationId: instance_network_interface_list
      parameters:
      - in: query
        name: instance
        description: Name or ID of the instance
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceNetworkInterfaceResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - instance
    post:
      tags:
      - instances
      summary: Create network interface
      operationId: instance_network_interface_create
      parameters:
      - in: query
        name: instance
        description: Name or ID of the instance
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceNetworkInterfaceCreate'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceNetworkInterface'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/network-interfaces/{interface}:
    get:
      tags:
      - instances
      summary: Fetch network interface
      operationId: instance_network_interface_view
      parameters:
      - in: path
        name: interface
        description: Name or ID of the network interface
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: instance
        description: Name or ID of the instance
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceNetworkInterface'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - instances
      summary: Update network interface
      operationId: instance_network_interface_update
      parameters:
      - in: path
        name: interface
        description: Name or ID of the network interface
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: instance
        description: Name or ID of the instance
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceNetworkInterfaceUpdate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceNetworkInterface'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - instances
      summary: Delete network interface
      description: Note that the primary interface for an instance cannot be deleted if there are any secondary interfaces. A new primary interface must be designated first. The primary interface can be deleted if there are no secondary interfaces.
      operationId: instance_network_interface_delete
      parameters:
      - in: path
        name: interface
        description: Name or ID of the network interface
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: instance
        description: Name or ID of the instance
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: project
        description: Name or ID of the project, only required if `instance` is provided as a `Name`
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    Ipv4Assignment:
      description: How a VPC-private IP address is assigned to a network interface.
      oneOf:
      - description: Automatically assign an IP address from the VPC Subnet.
        type: object
        properties:
          type:
            type: string
            enum:
            - auto
        required:
        - type
      - description: Explicitly assign a specific address, if available.
        type: object
        properties:
          type:
            type: string
            enum:
            - explicit
          value:
            type: string
            format: ipv4
        required:
        - type
        - value
    DiskPath:
      type: object
      properties:
        disk:
          description: Name or ID of the disk
          allOf:
          - $ref: '#/components/schemas/NameOrId'
      required:
      - disk
    InstanceNetworkInterfaceResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/InstanceNetworkInterface'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    ExternalIpCreate:
      description: Parameters for creating an external IP address for instances.
      oneOf:
