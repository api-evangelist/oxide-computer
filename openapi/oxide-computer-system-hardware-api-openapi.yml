          type:
          - string
          - 'null'
      required:
      - items
    SwitchResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/Switch'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    Baseboard:
      description: Properties that uniquely identify an Oxide hardware component
      type: object
      properties:
        part:
          type: string
        revision:
          type: integer
          format: uint32
          minimum: 0
        serial:
          type: string
      required:
      - part
      - revision
      - serial
    SwitchSlot:
      description: Identifies switch physical location
      oneOf:
      - description: Switch in upper slot
        type: string
        enum:
        - switch0
      - description: Switch in lower slot
        type: string
        enum:
        - switch1
    SledState:
      description: The current state of the sled.
      oneOf:
      - description: The sled is currently active, and has resources allocated on it.
        type: string
        enum:
        - active
      - description: 'The sled has been permanently removed from service.


          This is a terminal state: once a particular sled ID is decommissioned, it will never return to service. (The actual hardware may be reused, but it will be treated as a brand-new sled.)'
        type: string
        enum:
        - decommissioned
    PhysicalDisk:
      description: 'View of a Physical Disk


        Physical disks reside in a particular sled and are used to store both Instance Disk data as well as internal metadata.'
      type: object
      properties:
        form_factor:
          $ref: '#/components/schemas/PhysicalDiskKind'
        id:
          description: Unique, immutable, system-controlled identifier for each resource
          type: string
          format: uuid
        model:
          type: string
        policy:
          description: The operator-defined policy for a physical disk.
          allOf:
          - $ref: '#/components/schemas/PhysicalDiskPolicy'
        serial:
          type: string
        sled_id:
          description: The sled to which this disk is attached, if any.
          type:
          - string
          - 'null'
          format: uuid
        state:
          description: The current state Nexus believes the disk to be in.
          allOf:
          - $ref: '#/components/schemas/PhysicalDiskState'
        time_created:
          description: Timestamp when this resource was created
          type: string
          format: date-time
        time_modified:
          description: Timestamp when this resource was last modified
          type: string
          format: date-time
        vendor:
          type: string
      required:
      - form_factor
      - id
      - model
      - policy
      - serial
      - state
      - time_created
      - time_modified
      - vendor
    UninitializedSled:
