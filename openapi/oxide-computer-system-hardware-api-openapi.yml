openapi: 3.2.0
info:
  title: Oxide Region System/hardware API
  description: API for interacting with the Oxide control plane
  contact:
    url: https://oxide.computer
    email: api@oxide.computer
  version: 2026081901.0.0
tags:
- name: system/hardware
  description: These operations pertain to hardware inventory and management. Racks are the unit of expansion of an Oxide deployment. Racks are in turn composed of sleds, switches, power supplies, and a cabled backplane.
  externalDocs:
    url: http://docs.oxide.computer/api/system-hardware
paths:
  /v1/system/hardware/disk-adoption-request:
    put:
      tags:
      - system/hardware
      summary: Enable adoption of a physical disk for general use
      operationId: physical_disk_enable_adoption
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalDiskManufacturerIdentity'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalDiskAdoptionRequest'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/disk-adoption-request/{physical_disk_adoption_req_id}:
    delete:
      tags:
      - system/hardware
      summary: Disable adoption of a physical disk for general use
      operationId: physical_disk_disable_adoption
      parameters:
      - in: path
        name: physical_disk_adoption_req_id
        description: ID of the physical disk adoption request
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/disk-adoption-requests:
    get:
      tags:
      - system/hardware
      summary: List physical disk adoption requests
      operationId: physical_disk_list_adoption_requests
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalDiskAdoptionRequestResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/disks:
    get:
      tags:
      - system/hardware
      summary: List physical disks
      operationId: physical_disk_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalDiskResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/disks/{disk_id}:
    get:
      tags:
      - system/hardware
      summary: Get physical disk
      operationId: physical_disk_view
      parameters:
      - in: path
        name: disk_id
        description: ID of the physical disk
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalDisk'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/disks-unadopted:
    get:
      tags:
      - system/hardware
      summary: List physical disks that have not yet been adopted for use
      operationId: physical_disk_list_unadopted
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnadoptedPhysicalDiskResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/racks:
    get:
      tags:
      - system/hardware
      summary: List racks
      operationId: rack_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/racks/{rack_id}:
    get:
      tags:
      - system/hardware
      summary: Fetch rack
      operationId: rack_view
      parameters:
      - in: path
        name: rack_id
        description: ID of the rack
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rack'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/sleds:
    get:
      tags:
      - system/hardware
      summary: List sleds
      operationId: sled_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SledResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/sleds/{sled_id}:
    get:
      tags:
      - system/hardware
      summary: Fetch sled
      operationId: sled_view
      parameters:
      - in: path
        name: sled_id
        description: ID of the sled
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sled'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/sleds/{sled_id}/disks:
    get:
      tags:
      - system/hardware
      summary: List physical disks attached to sleds
      operationId: sled_physical_disk_list
      parameters:
      - in: path
        name: sled_id
        description: ID of the sled
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalDiskResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/sleds/{sled_id}/instances:
    get:
      tags:
      - system/hardware
      summary: List instances running on given sled
      operationId: sled_instance_list
      parameters:
      - in: path
        name: sled_id
        description: ID of the sled
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SledInstanceResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/hardware/sleds/{sled_id}/provision-policy:
    put:
      tags:
      - system/hardware
      summary: Set sled provision policy
      operationId: sled_set_provision_policy
      parameters:
      - in: path
        name: sled_id
        description: ID of the sled
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SledProvisionPolicyParams'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SledProvisionPolicyResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/hardware/sleds-uninitialized:
    get:
      tags:
      - system/hardware
      summary: List uninitialized sleds
      operationId: sled_list_uninitialized
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
