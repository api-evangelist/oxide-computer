      properties:
        disk_id:
          $ref: '#/components/schemas/PhysicalDiskManufacturerIdentity'
        sled_id:
          $ref: '#/components/schemas/SledUuid'
        slot:
          type: integer
          format: int64
        variant:
          $ref: '#/components/schemas/PhysicalDiskKind'
      required:
      - disk_id
      - sled_id
      - slot
      - variant
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
