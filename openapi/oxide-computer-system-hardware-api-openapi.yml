        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/SledInstance'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    SledProvisionPolicy:
      description: 'The operator-defined provision policy of a sled.


        This controls whether new resources are going to be provisioned on this sled.'
      oneOf:
      - description: New resources will be provisioned on this sled.
        type: string
        enum:
        - provisionable
      - description: New resources will not be provisioned on this sled. However, if the sled is currently in service, existing resources will continue to be on this sled unless manually migrated off.
        type: string
        enum:
        - non_provisionable
    RackResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/Rack'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    SwitchPortResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/SwitchPort'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    PhysicalDiskAdoptionRequestUuid:
      x-rust-type:
        crate: omicron-uuid-kinds
        path: omicron_uuid_kinds::PhysicalDiskAdoptionRequestUuid
        version: '*'
      type: string
      format: uuid
    InstanceState:
      description: 'Running state of an Instance (primarily: booted or stopped)


        This typically reflects whether it''s starting, running, stopping, or stopped, but also includes states related to the Instance''s lifecycle'
      oneOf:
      - description: The instance is being created.
        type: string
        enum:
        - creating
      - description: The instance is currently starting up.
        type: string
        enum:
        - starting
      - description: The instance is currently running.
        type: string
        enum:
        - running
      - description: The instance has been requested to stop and a transition to "Stopped" is imminent.
        type: string
        enum:
        - stopping
      - description: The instance is currently stopped.
        type: string
        enum:
        - stopped
      - description: The instance is in the process of rebooting - it will remain in the "rebooting" state until the VM is starting once more.
        type: string
        enum:
        - rebooting
      - description: The instance is in the process of migrating - it will remain in the "migrating" state until the migration process is complete and the destination propolis is ready to continue execution.
        type: string
        enum:
        - migrating
      - description: The instance is attempting to recover from a failure.
        type: string
        enum:
        - repairing
      - description: The instance has encountered a failure.
        type: string
        enum:
        - failed
      - description: The instance has been deleted.
        type: string
        enum:
        - destroyed
    NameOrId:
      oneOf:
      - title: id
        allOf:
        - type: string
          format: uuid
      - title: name
        allOf:
        - $ref: '#/components/schemas/Name'
    SwitchLinkState: {}
    Name:
      title: A name unique within the parent collection
      description: Names must begin with a lower case ASCII letter, be composed exclusively of lowercase ASCII, uppercase ASCII, numbers, and '-', and may not end with a '-'. Names cannot be a UUID, but they may contain a UUID. They can be at most 63 characters long.
      type: string
      pattern: ^(?![0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$)^[a-z]([a-zA-Z0-9-]*[a-zA-Z0-9]+)?$
      minLength: 1
      maxLength: 63
    SledPolicy:
      description: The operator-defined policy of a sled.
      oneOf:
      - description: The operator has indicated that the sled is in-service.
        type: object
        properties:
          kind:
            type: string
            enum:
            - in_service
          provision_policy:
            description: Determines whether new resources can be provisioned onto the sled.
            allOf:
            - $ref: '#/components/schemas/SledProvisionPolicy'
        required:
        - kind
        - provision_policy
      - description: 'The operator has indicated that the sled has been permanently removed from service.


          This is a terminal state: once a particular sled ID is expunged, it will never return to service. (The actual hardware may be reused, but it will be treated as a brand-new sled.)


          An expunged sled is always non-provisionable.'
        type: object
        properties:
          kind:
            type: string
            enum:
            - expunged
        required:
        - kind
    SwitchPort:
      description: A switch port represents a physical external port on a rack switch.
      type: object
      properties:
        id:
          description: The id of the switch port.
          type: string
          format: uuid
        port_name:
          description: The name of this switch port.
          allOf:
          - $ref: '#/components/schemas/Name'
        port_settings_id:
          description: The primary settings group of this switch port. Will be `None` until this switch port is configured.
          type:
          - string
          - 'null'
          format: uuid
        rack_id:
          description: The rack this switch port belongs to.
          type: string
          format: uuid
        switch_slot:
          description: The slot of the switch within the rack of this switch port.
          allOf:
          - $ref: '#/components/schemas/SwitchSlot'
      required:
      - id
      - port_name
      - rack_id
      - switch_slot
    UnadoptedPhysicalDiskResultsPage:
