openapi: 3.2.0
info:
  title: Oxide Region System/silos API
  description: API for interacting with the Oxide control plane
  contact:
    url: https://oxide.computer
    email: api@oxide.computer
  version: 2026081901.0.0
tags:
- name: system/silos
  description: Silos represent a logical partition of users and resources.
  externalDocs:
    url: http://docs.oxide.computer/api/system-silos
paths:
  /v1/system/identity-providers:
    get:
      tags:
      - system/silos
      summary: List identity providers for silo
      description: List identity providers for silo by silo name or ID.
      operationId: silo_identity_provider_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: silo
        description: Name or ID of the silo
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - silo
  /v1/system/identity-providers/local/users:
    post:
      tags:
      - system/silos
      summary: Create user
      description: Users can only be created in Silos with `provision_type` == `Fixed`. Otherwise, Silo users are just-in-time (JIT) provisioned when a user first logs in using an external Identity Provider.
      operationId: local_idp_user_create
      parameters:
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/identity-providers/local/users/{user_id}:
    delete:
      tags:
      - system/silos
      summary: Delete user
      operationId: local_idp_user_delete
      parameters:
      - in: path
        name: user_id
        description: The user's internal ID
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/identity-providers/local/users/{user_id}/set-password:
    post:
      tags:
      - system/silos
      summary: Set or invalidate user's password
      description: Passwords can only be updated for users in Silos with identity mode `LocalOnly`.
      operationId: local_idp_user_set_password
      parameters:
      - in: path
        name: user_id
        description: The user's internal ID
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPassword'
        required: true
      responses:
        '204':
          description: resource updated
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/identity-providers/saml:
    post:
      tags:
      - system/silos
      summary: Create SAML identity provider
      operationId: saml_identity_provider_create
      parameters:
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamlIdentityProviderCreate'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlIdentityProvider'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/identity-providers/saml/{provider}:
    get:
      tags:
      - system/silos
      summary: Fetch SAML identity provider
      operationId: saml_identity_provider_view
      parameters:
      - in: path
        name: provider
        description: Name or ID of the SAML identity provider
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: silo
        description: Name or ID of the silo
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlIdentityProvider'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/scim/tokens:
    get:
      tags:
      - system/silos
      summary: List SCIM tokens
      description: Specify the silo by name or ID using the `silo` query parameter.
      operationId: scim_token_list
      parameters:
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                title: Array_of_ScimClientBearerToken
                type: array
                items:
                  $ref: '#/components/schemas/ScimClientBearerToken'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - system/silos
      summary: Create SCIM token
      description: Specify the silo by name or ID using the `silo` query parameter. Be sure to save the bearer token in the response. It will not be retrievable later through the token view and list endpoints.
      operationId: scim_token_create
      parameters:
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimClientBearerTokenValue'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/scim/tokens/{token_id}:
    get:
      tags:
      - system/silos
      summary: Fetch SCIM token
      description: Specify the silo by name or ID using the `silo` query parameter.
      operationId: scim_token_view
      parameters:
      - in: path
        name: token_id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimClientBearerToken'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - system/silos
      summary: Delete SCIM token
      description: Specify the silo by name or ID using the `silo` query parameter.
      operationId: scim_token_delete
      parameters:
      - in: path
        name: token_id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/silo-quotas:
    get:
      tags:
      - system/silos
      summary: List resource quotas for all silos
      operationId: system_quotas_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloQuotasResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/silos:
    get:
      tags:
      - system/silos
      summary: List silos
      description: Lists silos that are discoverable based on the current permissions.
      operationId: silo_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
    post:
      tags:
      - system/silos
      summary: Create silo
      operationId: silo_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloCreate'
        required: true
      responses:
        '201':
          description: successful creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Silo'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/silos/{silo}:
    get:
      tags:
      - system/silos
      summary: Fetch silo
      description: Fetch silo by name or ID.
      operationId: silo_view
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Silo'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - system/silos
      summary: Delete silo
      description: Delete a silo by name or ID.
      operationId: silo_delete
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '204':
          description: successful deletion
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/silos/{silo}/ip-pools:
    get:
      tags:
      - system/silos
      summary: List IP pools linked to silo
      description: Linked IP pools are available to users in the specified silo. A silo can have at most one default pool. IPs are allocated from the default pool when users ask for one without specifying a pool.
      operationId: silo_ip_pool_list
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloIpPoolResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/silos/{silo}/policy:
    get:
      tags:
      - system/silos
      summary: Fetch silo IAM policy
      operationId: silo_policy_view
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloRolePolicy'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - system/silos
      summary: Update silo IAM policy
      operationId: silo_policy_update
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloRolePolicy'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloRolePolicy'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/silos/{silo}/quotas:
    get:
      tags:
      - system/silos
      summary: Fetch resource quotas for silo
      operationId: silo_quotas_view
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloQuotas'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - system/silos
      summary: Update resource quotas for silo
      description: If a quota value is not specified, it will remain unchanged.
      operationId: silo_quotas_update
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloQuotasUpdate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloQuotas'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/silos/{silo}/subnet-pools:
    get:
      tags:
      - system/silos
      summary: List subnet pools linked to a silo
      operationId: silo_subnet_pool_list
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloSubnetPoolResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/users:
    get:
      tags:
      - system/silos
      summary: List built-in (system) users in silo
      operationId: silo_user_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: silo
        description: Name or ID of the silo
        schema:
          $ref: '#/components/schemas/NameOrId'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/IdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - silo
  /v1/system/users/{user_id}:
    get:
      tags:
      - system/silos
      summary: Fetch built-in (system) user
      operationId: silo_user_view
      parameters:
      - in: path
        name: user_id
        description: The user's internal ID
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/users-builtin:
    get:
      tags:
      - system/silos
      summary: List built-in users
      operationId: user_builtin_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBuiltinResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/users-builtin/{user}:
    get:
      tags:
      - system/silos
      summary: Fetch built-in user
      operationId: user_builtin_view
      parameters:
      - in: path
        name: user
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBuiltin'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/utilization/silos:
    get:
      tags:
      - system/silos
      summary: List current utilization state for all silos
      operationId: silo_utilization_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: sort_by
        schema:
          $ref: '#/components/schemas/NameOrIdSortMode'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloUtilizationResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
  /v1/system/utilization/silos/{silo}:
    get:
      tags:
      - system/silos
      summary: Fetch current utilization for given silo
      operationId: silo_utilization_view
      parameters:
      - in: path
        name: silo
        description: Name or ID of the silo
        required: true
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloUtilization'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    UserResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    SiloRolePolicy:
      description: 'Policy for a particular resource


        Note that the Policy only describes access granted explicitly for this resource.  The policies of parent resources can also cause a user to have access to this resource.'
      type: object
      properties:
        role_assignments:
          description: Roles directly assigned on this resource
          type: array
          items:
            $ref: '#/components/schemas/SiloRoleRoleAssignment'
      required:
      - role_assignments
    FleetRole:
      type: string
      enum:
      - admin
      - collaborator
      - viewer
    SiloIpPoolResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/SiloIpPool'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    SiloQuotasCreate:
      description: The amount of provisionable resources for a Silo
      type: object
      properties:
        cpus:
          description: The amount of virtual CPUs available for running instances in the Silo
          type: integer
          format: int64
        memory:
          description: The amount of RAM (in bytes) available for running instances in the Silo
          allOf:
          - $ref: '#/components/schemas/ByteCount'
        storage:
          description: The amount of storage (in bytes) available for disks or snapshots
          allOf:
          - $ref: '#/components/schemas/ByteCount'
      required:
      - cpus
      - memory
