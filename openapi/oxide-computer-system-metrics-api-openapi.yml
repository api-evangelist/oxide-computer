          type: array
          items:
            $ref: '#/components/schemas/Binint32'
        max:
          description: The maximum value of all samples in the histogram.
          type: integer
          format: int32
        min:
          description: The minimum value of all samples in the histogram.
          type: integer
          format: int32
        n_samples:
          description: The total number of samples in the histogram.
          type: integer
          format: uint64
          minimum: 0
        p50:
          description: p50 Quantile
          allOf:
          - $ref: '#/components/schemas/Quantile'
        p90:
          description: p95 Quantile
          allOf:
          - $ref: '#/components/schemas/Quantile'
        p99:
          description: p99 Quantile
          allOf:
          - $ref: '#/components/schemas/Quantile'
        squared_mean:
          description: 'M2 for Welford''s algorithm for variance calculation.


            Read about [Welford''s algorithm](https://en.wikipedia.org/wiki/Algorithms_for_calculating_variance#Welford''s_online_algorithm) for more information on the algorithm.'
          type: number
          format: double
        start_time:
          description: The start time of the histogram.
          type: string
          format: date-time
        sum_of_samples:
          description: The sum of all samples in the histogram.
          type: integer
          format: int64
      required:
      - bins
      - max
      - min
      - n_samples
      - p50
      - p90
      - p99
      - squared_mean
      - start_time
      - sum_of_samples
    Error:
      description: Error information from a response.
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - message
      - request_id
    DatumType:
      description: The type of an individual datum of a metric.
      type: string
      enum:
      - bool
      - i8
      - u8
      - i16
      - u16
      - i32
      - u32
      - i64
      - u64
      - f32
      - f64
      - string
      - bytes
      - cumulative_i64
      - cumulative_u64
      - cumulative_f32
      - cumulative_f64
      - histogram_i8
      - histogram_u8
      - histogram_i16
      - histogram_u16
