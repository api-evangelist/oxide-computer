openapi: 3.2.0
info:
  title: Oxide Region System/metrics API
  description: API for interacting with the Oxide control plane
  contact:
    url: https://oxide.computer
    email: api@oxide.computer
  version: 2026081901.0.0
tags:
- name: system/metrics
  description: Metrics provide insight into the operation of the Oxide deployment. These include telemetry on hardware and software components that can be used to understand the current state as well as to diagnose issues.
  externalDocs:
    url: http://docs.oxide.computer/api/system-metrics
paths:
  /v1/system/metrics/{metric_name}:
    get:
      tags:
      - system/metrics
      summary: View metrics
      description: View CPU, memory, or storage utilization metrics at the fleet or silo level.
      operationId: system_metric
      parameters:
      - in: path
        name: metric_name
        required: true
        schema:
          $ref: '#/components/schemas/SystemMetricName'
      - in: query
        name: end_time
        description: An exclusive end time of metrics.
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: order
        description: Query result order
        schema:
          $ref: '#/components/schemas/PaginationOrder'
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: start_time
        description: An inclusive start time of metrics.
        schema:
          type: string
          format: date-time
      - in: query
        name: silo
        description: Name or ID of the silo
        schema:
          $ref: '#/components/schemas/NameOrId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required:
        - end_time
        - start_time
  /v1/system/timeseries/query:
    post:
      tags:
      - system/metrics
      summary: Run timeseries query
      description: Queries are written in OxQL.
      operationId: system_timeseries_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeseriesQuery'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OxqlQueryResult'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/timeseries/schemas:
    get:
      tags:
      - system/metrics
      summary: List timeseries schemas
      operationId: system_timeseries_schema_list
      parameters:
      - in: query
        name: limit
        description: Maximum number of items returned by a single call
        schema:
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 1
      - in: query
        name: page_token
        description: Token returned by previous call to retrieve the subsequent page
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesSchemaResultsPage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      x-dropshot-pagination:
        required: []
components:
  schemas:
    Binuint16:
      description: Type storing bin edges and a count of samples within it.
      type: object
      properties:
        count:
          description: The total count of samples in this bin.
          type: integer
          format: uint64
          minimum: 0
        range:
          description: The range of the support covered by this bin.
          allOf:
          - $ref: '#/components/schemas/BinRangeuint16'
      required:
      - count
      - range
    Values:
      description: A single list of values, for one dimension of a timeseries.
      type: object
      properties:
        metric_type:
          description: The type of this metric.
          allOf:
          - $ref: '#/components/schemas/MetricType'
        values:
          description: The data values.
          allOf:
          - $ref: '#/components/schemas/ValueArray'
      required:
      - metric_type
      - values
    BinRangeint16:
      description: 'A type storing a range over `T`.


        This type supports ranges similar to the `RangeTo`, `Range` and `RangeFrom` types in the standard library. Those cover `(..end)`, `(start..end)`, and `(start..)` respectively.'
      oneOf:
      - description: A range unbounded below and exclusively above, `..end`.
        type: object
        properties:
          end:
            type: integer
            format: int16
          type:
            type: string
            enum:
            - range_to
        required:
        - end
        - type
      - description: A range bounded inclusively below and exclusively above, `start..end`.
        type: object
        properties:
          end:
            type: integer
            format: int16
          start:
            type: integer
            format: int16
          type:
            type: string
            enum:
            - range
        required:
        - end
        - start
        - type
      - description: A range bounded inclusively below and unbounded above, `start..`.
        type: object
        properties:
          start:
            type: integer
            format: int16
          type:
            type: string
            enum:
            - range_from
        required:
        - start
        - type
    BinRangeint32:
      description: 'A type storing a range over `T`.


        This type supports ranges similar to the `RangeTo`, `Range` and `RangeFrom` types in the standard library. Those cover `(..end)`, `(start..end)`, and `(start..)` respectively.'
