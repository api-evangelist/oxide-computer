    delete:
      tags:
      - system/networking
      summary: Delete loopback address
      operationId: networking_loopback_address_delete
      parameters:
      - in: path
        name: address
        description: The IP address and subnet mask to use when selecting the loopback address.
        required: true
        schema:
          type: string
          format: ip
      - in: path
        name: rack_id
        description: The rack to use when selecting the loopback address.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: subnet_mask
        description: The IP address and subnet mask to use when selecting the loopback address.
        required: true
        schema:
          type: integer
          format: uint8
          minimum: 0
