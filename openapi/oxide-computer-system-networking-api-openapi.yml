        '204':
          description: resource updated
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/system/networking/bfd-status:
    get:
      tags:
      - system/networking
      summary: Get BFD status
      operationId: networking_bfd_status
      responses:
        '200':
          description: successful operation
