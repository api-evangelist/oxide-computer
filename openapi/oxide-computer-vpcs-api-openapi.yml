components:
  schemas:
    VpcFirewallRuleStatus:
      type: string
      enum:
      - disabled
      - enabled
    InternetGatewayIpAddressCreate:
      description: Create-time identity-related parameters
      type: object
      properties:
        address:
          type: string
          format: ip
        description:
          type: string
        name:
          $ref: '#/components/schemas/Name'
      required:
      - address
      - description
      - name
    VpcSubnet:
      description: A VPC subnet represents a logical grouping for instances that allows network traffic between them, within an IPv4 subnetwork or optionally an IPv6 subnetwork.
      type: object
      properties:
        custom_router_id:
          description: ID for an attached custom router.
          type:
          - string
          - 'null'
          format: uuid
        description:
          description: Human-readable free-form text about a resource
          type: string
        id:
          description: Unique, immutable, system-controlled identifier for each resource
          type: string
          format: uuid
        ipv4_block:
          description: The IPv4 subnet CIDR block.
          allOf:
          - $ref: '#/components/schemas/Ipv4Net'
        ipv6_block:
          description: The IPv6 subnet CIDR block.
          allOf:
          - $ref: '#/components/schemas/Ipv6Net'
        name:
          description: Unique, mutable, user-controlled identifier for each resource
          allOf:
          - $ref: '#/components/schemas/Name'
        time_created:
          description: Timestamp when this resource was created
          type: string
          format: date-time
        time_modified:
          description: Timestamp when this resource was last modified
          type: string
          format: date-time
        vpc_id:
          description: The VPC to which the subnet belongs.
          type: string
          format: uuid
      required:
      - description
      - id
      - ipv4_block
      - ipv6_block
      - name
      - time_created
      - time_modified
      - vpc_id
    InstanceNetworkInterfaceResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/InstanceNetworkInterface'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    VpcResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/Vpc'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    VpcFirewallRuleUpdateParams:
      description: Updated list of firewall rules. Will replace all existing rules.
      type: object
      properties:
        rules:
          default: []
          type: array
          items:
            $ref: '#/components/schemas/VpcFirewallRuleUpdate'
          maxItems: 1024
    VpcFirewallRuleFilter:
      description: Filters reduce the scope of a firewall rule. Without filters, the rule applies to all packets to the targets (or from the targets, if it's an outbound rule). With multiple filters, the rule applies only to packets matching ALL filters. The maximum number of each type of filter is 256.
      type: object
      properties:
        hosts:
          description: 'If present, host filters match the "other end" of traffic from the target’s perspective: for an inbound rule, they match the source of traffic. For an outbound rule, they match the destination.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VpcFirewallRuleHostFilter'
          maxItems: 256
        ports:
          description: If present, the destination ports or port ranges this rule applies to.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/L4PortRange'
          maxItems: 256
        protocols:
          description: If present, the networking protocols this rule applies to.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VpcFirewallRuleProtocol'
          maxItems: 256
    InternetGatewayIpPoolResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/InternetGatewayIpPool'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    L4PortRange:
      example: '22'
      title: A range of IP ports
      description: An inclusive-inclusive range of IP ports. The second port may be omitted to represent a single port.
      type: string
      pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
      minLength: 1
      maxLength: 11
    NameOrIdSortMode:
      description: Supported set of sort modes for scanning by name or id
      oneOf:
      - description: Sort in increasing order of "name"
        type: string
        enum:
        - name_ascending
      - description: Sort in decreasing order of "name"
        type: string
        enum:
        - name_descending
      - description: Sort in increasing order of "id"
        type: string
        enum:
        - id_ascending
    InternetGatewayCreate:
      description: Create-time parameters for an `InternetGateway`
      type: object
      properties:
        description:
          type: string
        name:
          $ref: '#/components/schemas/Name'
      required:
      - description
      - name
    VpcSubnetUpdate:
      description: Updateable properties of a `VpcSubnet`
      type: object
      properties:
        custom_router:
          description: An optional router, used to direct packets sent from hosts in this subnet to any destination address.
          allOf:
          - $ref: '#/components/schemas/NameOrId'
        description:
          type:
          - string
          - 'null'
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
    MacAddr:
      example: ff:ff:ff:ff:ff:ff
      title: A MAC address
      description: A Media Access Control address, in EUI-48 format
      type: string
      pattern: ^([0-9a-fA-F]{0,2}:){5}[0-9a-fA-F]{0,2}$
      minLength: 5
      maxLength: 17
    IcmpParamRange:
      example: '3'
      title: A range of ICMP(v6) types or codes
      description: An inclusive-inclusive range of ICMP(v6) types or codes. The second value may be omitted to represent a single parameter.
      type: string
      pattern: ^[0-9]{1,3}(-[0-9]{1,3})?$
      minLength: 1
      maxLength: 7
    InternetGatewayIpPoolCreate:
      description: Create-time identity-related parameters
      type: object
      properties:
        description:
          type: string
        ip_pool:
          $ref: '#/components/schemas/NameOrId'
        name:
          $ref: '#/components/schemas/Name'
      required:
      - description
      - ip_pool
      - name
    VpcFirewallRuleHostFilter:
      description: The `VpcFirewallRuleHostFilter` is used to filter traffic on the basis of its source or destination host.
      oneOf:
      - description: The rule applies to traffic from/to all instances in the VPC
        type: object
        properties:
          type:
            type: string
            enum:
            - vpc
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to traffic from/to all instances in the VPC Subnet
        type: object
        properties:
          type:
            type: string
            enum:
            - subnet
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to traffic from/to this specific instance
        type: object
        properties:
          type:
            type: string
            enum:
            - instance
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to traffic from/to a specific IP address
        type: object
        properties:
          type:
            type: string
            enum:
            - ip
          value:
            type: string
            format: ip
        required:
        - type
        - value
      - description: The rule applies to traffic from/to a specific IP subnet
        type: object
        properties:
          type:
            type: string
            enum:
            - ip_net
          value:
            $ref: '#/components/schemas/IpNet'
        required:
        - type
        - value
    Error:
      description: Error information from a response.
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - message
      - request_id
    VpcFirewallRuleTarget:
      description: 'A `VpcFirewallRuleTarget` is used to specify the set of instances to which a firewall rule applies. You can target instances directly by name, or specify a VPC, VPC subnet, IP, or IP subnet, which will apply the rule to traffic going to all matching instances. Targets are additive: the rule applies to instances matching ANY target.'
      oneOf:
      - description: The rule applies to all instances in the VPC
        type: object
        properties:
          type:
            type: string
            enum:
            - vpc
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to all instances in the VPC Subnet
        type: object
        properties:
          type:
            type: string
            enum:
            - subnet
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to this specific instance
        type: object
        properties:
          type:
            type: string
            enum:
            - instance
          value:
            $ref: '#/components/schemas/Name'
        required:
        - type
        - value
      - description: The rule applies to a specific IP address
        type: object
        properties:
          type:
            type: string
            enum:
            - ip
          value:
            type: string
            format: ip
        required:
        - type
        - value
      - description: The rule applies to a specific IP subnet
        type: object
        properties:
          type:
            type: string
            enum:
            - ip_net
          value:
            $ref: '#/components/schemas/IpNet'
        required:
        - type
        - value
    InternetGateway:
      description: An internet gateway provides a path between VPC networks and external networks.
      type: object
      properties:
        description:
          description: Human-readable free-form text about a resource
          type: string
        id:
          description: Unique, immutable, system-controlled identifier for each resource
          type: string
          format: uuid
        name:
          description: Unique, mutable, user-controlled identifier for each resource
          allOf:
          - $ref: '#/components/schemas/Name'
        time_created:
          description: Timestamp when this resource was created
          type: string
          format: date-time
        time_modified:
          description: Timestamp when this resource was last modified
          type: string
          format: date-time
        vpc_id:
          description: The VPC to which the gateway belongs.
          type: string
          format: uuid
      required:
      - description
      - id
      - name
      - time_created
      - time_modified
      - vpc_id
    InternetGatewayIpAddressResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/InternetGatewayIpAddress'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    InternetGatewayIpAddress:
      description: An IP address that is attached to an internet gateway
      type: object
      properties:
        address:
          description: The associated IP address
          type: string
          format: ip
        description:
          description: Human-readable free-form text about a resource
          type: string
        id:
          description: Unique, immutable, system-controlled identifier for each resource
          type: string
          format: uuid
        internet_gateway_id:
          description: The associated internet gateway
          type: string
          format: uuid
        name:
          description: Unique, mutable, user-controlled identifier for each resource
          allOf:
          - $ref: '#/components/schemas/Name'
        time_created:
          description: Timestamp when this resource was created
          type: string
          format: date-time
        time_modified:
          description: Timestamp when this resource was last modified
          type: string
          format: date-time
      required:
      - address
      - description
      - id
      - internet_gateway_id
      - name
      - time_created
      - time_modified
    VpcSubnetResultsPage:
      description: A single page of results
      type: object
      properties:
        items:
          description: list of items on this page of results
          type: array
          items:
            $ref: '#/components/schemas/VpcSubnet'
        next_page:
          description: token used to fetch the next page of results (if any)
          type:
          - string
          - 'null'
      required:
      - items
    VpcRouterCreate:
      description: Create-time parameters for a `VpcRouter`
      type: object
      properties:
        description:
          type: string
        name:
          $ref: '#/components/schemas/Name'
      required:
      - description
      - name
    RouteDestination:
      description: 'A `RouteDestination` is used to match traffic with a routing rule based on the destination of that traffic.


        When traffic is to be sent to a destination that is within a given `RouteDestination`, the corresponding `RouterRoute` applies, and traffic will be forward to the `RouteTarget` for that rule.'
      oneOf:
      - description: Route applies to traffic destined for the specified IP address
        type: object
        properties:
          type:
            type: string
            enum:
            - ip
          value:
            type: string
            format: ip
        required:
        - type
        - value
      - description: Route applies to traffic destined for the specified IP subnet
        type: object
        properties:
          type:
            type: string
            enum:
            - ip_net
          value:
            $ref: '#/components/schemas/IpNet'
        required:
        - type
        - value
      - description: Route applies to traffic destined for the specified VPC
        type: object
