domain_standard:
  market: cloud infrastructure / IaaS control plane
  finding: >-
    The cloud-infrastructure market has no ratified cross-vendor control-plane API standard — there
    is no IaaS equivalent of FHIR, SCIM or OpenRTB that Oxide could conform to, so nothing is
    claimed here and nothing is invented to fill the slot. The two genuine domain standards Oxide
    DOES declare in its contract are identity standards, and both are recorded above with their
    exact spec locations: SAML 2.0 (saml_identity_provider_create / login_saml) and SCIM 2.0
    (v1/system/scim/tokens, announced in system release v17). Oxide's own posture on de facto
    standardisation is the opposite of conformance: the product exists to replace the hyperscaler
    control plane rather than reimplement its API, and the entire stack — control plane (omicron),
    hypervisor userspace (propolis), block storage (crucible), routing (maghemite), packet
    transformation (opte), host OS (helios), embedded OS (hubris) and the dropshot REST framework
    that generates this very OpenAPI document — is published open source under github.com/oxidecomputer.
  standards_declared_in_contract: [saml2, scim2, oauth2-device-grant]

compliance:
  certifications_published: false
  trust_center: false
  note: >-
    No trust center, no SOC 2 / ISO 27001 / FedRAMP / PCI / HIPAA certification page found on
    oxide.computer. Oxide publishes security advisories and announcements
    (https://docs.oxide.computer/security/advisories) and an RFC 9116 security.txt, and the API
    carries an operator audit log with 90-day retention (audit_log_list, system release v19), but
    no attestation program is published. Recorded as absent, not assumed.
