standards:
- id: openapi
  version: 3.0.3
  conforms: true
  evidence: 'openapi/oxide-computer-region-api-openapi.json — openapi: "3.0.3", 217 paths, 315 operations, 469 component schemas, info.version 2026081901.0.0'
- id: oauth2-device-grant
  name: OAuth 2.0 Device Authorization Grant (RFC 8628)
  conforms: true
  evidence: >-
    Three operations implement the grant verbatim — device_auth_request (POST /device/auth,
    summary "Start an OAuth 2.0 Device Authorization Grant"), device_auth_confirm
    (POST /device/confirm) and device_access_token (POST /device/token, "Request a device access
    token"). Documented at https://docs.oxide.computer/api/guides/authentication.
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: partial
  evidence: >-
    Only the device authorization grant is implemented. No authorization-code or client-credentials
    flow, no scope vocabulary, and no /.well-known/oauth-authorization-server metadata document
    (RFC 8414) — probed 404 on oxide.computer, and the control plane is customer-hosted so there is
    no vendor host to serve one.
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: '/.well-known/openid-configuration returns 404 on oxide.computer; no OIDC surface in the spec'
- id: saml2
  name: SAML 2.0
  conforms: true
  evidence: >-
    Per-silo SAML identity providers are first-class API resources —
    saml_identity_provider_create (POST /v1/system/identity-providers/saml),
    saml_identity_provider_view, and login_saml (POST /login/{silo_name}/saml/{provider_name},
    "Authenticate user via SAML"). Integration guides published for Keycloak, Microsoft Entra ID
    and Duo.
- id: scim2
  name: SCIM 2.0 (System for Cross-domain Identity Management, RFC 7643/7644)
  conforms: true
  evidence: >-
    Oxide's v17 system release notes announce "SCIM v2.0 support". The public contract exposes the
    token surface a SCIM client authenticates with — scim_token_create, scim_token_list,
    scim_token_view, scim_token_delete under /v1/system/scim/tokens, scoped per silo. The
    /scim/v2/Users and /Groups resource endpoints themselves are not present in the external
    OpenAPI document, so the standard is declared and its credential surface is contracted, but
    the SCIM resource schemas (urn:ietf:params:scim:schemas:*) do not appear in this spec.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors use a custom application/json envelope (message, request_id, error_code) via
    #/components/schemas/Error, not application/problem+json. See
    errors/oxide-computer-problem-types.yml.
- id: rfc9116
  name: security.txt
  conforms: true
